<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트립릴스 · 여행지 영상 미리보기</title>
<meta name="description" content="가고 싶은 여행지를 입력하면 주요 명소를 짧은 영상으로 보여주고, 항공편·호텔 검색까지 한 번에.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6b4a'/%3E%3Cpath d='M25 19.5v25a1.5 1.5 0 0 0 2.3 1.3l19.5-12.5a1.5 1.5 0 0 0 0-2.6L27.3 18.2a1.5 1.5 0 0 0-2.3 1.3z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#ff6b4a">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#ffffff; --soft:#f6f8fb; --line:#e8ecf2;
    --text:#1b2333; --muted:#6b7588; --accent:#ff6b4a; --accent-soft:#fff1ec; --blue:#2f80ed;
    --radius:16px; --shadow:0 1px 2px #1b233308, 0 6px 20px #1b23330d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:1160px;margin:0 auto;padding:0 20px}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(180deg,#fff4ef 0%,#eef6ff 100%)}
  .hero .wrap{padding-top:28px;padding-bottom:44px}
  .logo{font-weight:800;letter-spacing:-.02em;font-size:19px;display:inline-flex;align-items:center;gap:8px;margin-bottom:48px;cursor:pointer}
  .logo i{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
  h1{font-size:clamp(28px,4.6vw,46px);line-height:1.2;letter-spacing:-.03em;font-weight:800}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{color:var(--muted);margin-top:10px;font-size:16.5px}

  .search{margin-top:28px;background:#fff;border-radius:20px;padding:8px;box-shadow:var(--shadow);display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr .7fr auto;gap:4px}
  .field{border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;min-width:0;transition:background .15s}
  .field + .field{border-left:1px solid var(--line);border-radius:0}
  .field:hover,.field:focus-within{background:var(--soft);border-radius:12px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input,.field select{background:none;border:0;outline:0;font-size:15.5px;font-weight:600;padding:2px 0;width:100%}
  .go{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:0 24px;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap;transition:transform .15s,background .15s}
  .go:hover{background:#f25a38;transform:translateY(-1px)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .flag{height:13px;width:auto;border-radius:2px;box-shadow:0 0 0 1px #0000000f}

  /* ---------- Browse all ---------- */
  main{padding:40px 0 80px}
  .region{margin-bottom:28px}
  .region h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:10px}
  .region .chips{margin-top:0}

  /* ---------- Destination ---------- */
  .dest-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .dest-head h2{font-size:32px;letter-spacing:-.02em;font-weight:800;display:flex;align-items:center;gap:10px}
  .dest-head h2 .flag{height:26px}
  .dest-head p{color:var(--muted);margin-top:2px}
  .facts{display:flex;gap:8px;flex-wrap:wrap}
  .fact{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
  .fact b{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .tabs{display:flex;gap:4px;position:sticky;top:0;z-index:5;background:#ffffffeb;backdrop-filter:blur(8px);padding:12px 0;border-bottom:1px solid var(--line)}
  .tab{padding:7px 14px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted)}
  .tab:hover{color:var(--text);background:var(--soft)}
  section.block{scroll-margin-top:70px;margin-top:36px}
  .block-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .block-title h3{font-size:21px;letter-spacing:-.01em}
  .block-title small{color:var(--muted);font-size:13px}

  /* ---------- Video grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .vcard{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--soft);aspect-ratio:9/13;cursor:pointer;isolation:isolate;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
  .vcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px #1b23331f}
  .vcard video,.vcard img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  .vcard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0000 50%,#000000b3 100%)}
  .vcard .skeleton{position:absolute;inset:0;z-index:-3;background:linear-gradient(100deg,#eef1f6 30%,#f8f9fb 50%,#eef1f6 70%);background-size:300% 100%;animation:sh 1.4s infinite}
  @keyframes sh{to{background-position:-150% 0}}
  .vcard .meta{position:absolute;left:0;right:0;bottom:0;padding:16px;color:#fff}
  .vcard .meta h4{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .vcard .meta p{font-size:13px;color:#ffffffd9;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{position:absolute;top:12px;left:12px;background:#ffffffe6;color:var(--text);border-radius:999px;font-size:11.5px;padding:4px 9px;font-weight:600}
  .badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .next{position:absolute;top:10px;right:10px;background:#ffffffe6;color:var(--text);border:0;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:14px;opacity:0;transition:opacity .2s}
  .vcard:hover .next{opacity:1}
  .yt{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:600;background:#ffffff26;backdrop-filter:blur(4px);border-radius:8px;padding:4px 9px}
  .yt:hover{background:#ffffff40}

  /* ---------- Info cards ---------- */
  .two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  .panel{background:var(--soft);border-radius:var(--radius);padding:22px}
  .panel h4{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:12px}
  .kv{display:grid;grid-template-columns:100px 1fr;gap:10px 14px;font-size:15px}
  .kv dt{color:var(--muted)}
  .kv dd{font-weight:600}
  .route{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .route .ap{font-size:28px;font-weight:800;letter-spacing:.02em}
  .route .ap small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
  .route .line{flex:1;height:2px;background:repeating-linear-gradient(90deg,#cfd6e2 0 8px,transparent 8px 14px);position:relative}
  .route .line::after{content:"✈";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:var(--soft);padding:0 6px;color:var(--accent)}
  .route .dur{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
  .links{display:grid;gap:10px}
  .lnk{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .15s,box-shadow .15s}
  .lnk:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .lnk b{font-size:15.5px}
  .lnk span{font-size:12.5px;color:var(--muted);display:block}
  .lnk .arr{color:var(--accent);font-weight:700}
  .areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .area{background:#fff;border-radius:14px;padding:14px 16px}
  .area b{font-size:16px}
  .area p{font-size:13px;color:var(--muted);margin-top:3px}
  .area .mini{display:flex;gap:6px;margin-top:10px}
  .area .mini a{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .area .mini a:hover{border-color:var(--accent);color:var(--accent)}
  .note{font-size:12.5px;color:var(--muted);margin-top:14px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}

  /* ---------- 연관 검색어 ---------- */
  .field.dest{position:relative}
  .suggest{position:absolute;left:-8px;right:-8px;top:calc(100% + 10px);background:#fff;border-radius:16px;box-shadow:0 12px 40px #1b23332e;list-style:none;padding:6px;z-index:20;max-height:400px;overflow:auto}
  .suggest .head{font-size:12px;color:var(--muted);font-weight:600;padding:8px 12px 4px}
  .suggest li.opt{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer}
  .suggest li.opt.on{background:var(--soft)}
  .suggest .ic{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:15px}
  .suggest .ic .flag{height:14px}
  .suggest b{font-weight:600;font-size:15px}
  .suggest b mark{background:none;color:var(--accent)}
  .suggest small{display:block;font-size:12.5px;color:var(--muted)}
  .suggest .kind{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 7px;flex:none}

  /* ---------- 도착 공항 · 환율 ---------- */
  .ap-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .ap-pick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .ap-pick button:hover{border-color:var(--accent)}
  .ap-pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fact.fx{background:var(--accent-soft)}
  .fact.fx b{color:#c2553b}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;background:#0f1522d9;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modal-box{width:min(960px,100%);background:#fff;border-radius:20px;overflow:hidden}
  .modal video{display:block;width:100%;max-height:70vh;background:#000}
  .modal-info{padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .modal-info h4{font-size:19px}
  .modal-info p{font-size:13px;color:var(--muted)}
  .modal-info .acts{display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .x{position:absolute;top:16px;right:20px;font-size:30px;background:none;border:0;cursor:pointer;color:#fff}

  @media (max-width:900px){
    .search{grid-template-columns:1fr 1fr}
    .search .field.dest{grid-column:1/-1}
    .field + .field{border-left:0}
    .go{grid-column:1/-1;padding:14px}
    .two{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .wrap{padding:0 16px}
    .logo{margin-bottom:28px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .vcard .meta{padding:10px}.vcard .meta h4{font-size:15px}.vcard .meta p{display:none}
    .dest-head h2{font-size:26px}
    .kv{grid-template-columns:86px 1fr}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="logo"><i>▶</i>트립릴스</div>
    <h1>어디로 떠나고 싶으세요?<br><em>명소를 영상으로 먼저 여행하세요</em></h1>
    <p class="sub">여행지를 입력하면 주요 관광지를 짧은 영상으로 보여드리고, 항공편·호텔 검색까지 바로 연결해 드려요.</p>

    <form class="search" id="searchForm" autocomplete="off">
      <div class="field dest">
        <label for="q">여행지 (국가 또는 도시)</label>
        <input id="q" placeholder="예: 일본, 오사카, 에펠탑, 다낭…" required autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest">
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </div>
      <div class="field">
        <label for="from">출발</label>
        <select id="from">
          <option value="ICN">인천 (ICN)</option>
          <option value="GMP">김포 (GMP)</option>
        </select>
      </div>
      <div class="field"><label for="d1">가는 날</label><input type="date" id="d1"></div>
      <div class="field"><label for="d2">오는 날</label><input type="date" id="d2"></div>
      <div class="field">
        <label for="pax">인원</label>
        <select id="pax"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
      </div>
      <button class="go" type="submit">여행 떠나기 ✈</button>
    </form>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="x" id="mClose" aria-label="닫기">×</button>
  <div class="modal-box">
    <video id="mVid" controls playsinline></video>
    <div class="modal-info">
      <div><h4 id="mTitle"></h4><p id="mCredit"></p></div>
      <div class="acts"><a class="btn" id="mYt" target="_blank" rel="noopener">YouTube 쇼츠 더보기</a><a class="btn" id="mSrc" target="_blank" rel="noopener">원본 영상</a></div>
    </div>
  </div>
</div>


<script>
/* =========================================================
   여행지 데이터 (항공 소요시간은 인천 출발 직항 기준 대략치)
   ========================================================= */
const DESTS = [

      {ko:"시부야 스크램블", en:"Shibuya Crossing", d:"한 번에 수천 명이 건너는 세계에서 가장 바쁜 교차로"},
      {ko:"후지산", en:"Mount Fuji", d:"일본의 상징, 가와구치코에서 보는 반영이 절경"},

    airlines:"대한항공, 아시아나, 에어프랑스", visa:"무비자 90일 (쉥겐)", currency:"유로 (EUR)", tz:"한국보다 8시간 느림 (서머타임 7시간)",

    areas:[{n:"마레",d:"감성 카페·편집숍, 도보 여행 최적"},{n:"생제르맹데프레",d:"클래식한 파리 감성, 안전한 편"},{n:"오페라",d:"백화점·공항버스 접근성 좋음"},{n:"에펠탑 주변(7구)",d:"뷰 맛집 호텔, 조용한 주거지"}]},
  { ko:"이탈리아", flag:"🇮🇹", aliases:["italy","로마","베네치아","베니스","피렌체","밀라노","rome","venice","florence"],
    tagline:"도시 전체가 박물관인 고대 문명의 땅", city:"로마", cityEn:"Rome", iata:"FCO", airport:"피우미치노", flight:"약 13시간",
    airlines:"대한항공, 아시아나, ITA항공", visa:"무비자 90일 (쉥겐)", currency:"유로 (EUR)", tz:"한국보다 8시간 느림",
    spots:[
      {ko:"콜로세움", en:"Colosseum Rome", d:"2천 년 전 검투사들의 원형 경기장"},
      {ko:"트레비 분수", en:"Trevi Fountain", d:"동전을 던지면 로마에 다시 온다는 전설"},
      {ko:"베네치아 대운하", en:"Grand Canal Venice", d:"곤돌라가 오가는 물의 도시"},

const cache = new Map();
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const words = t => fold(t).split(/[\s-]+/).filter(w => w.length > 3);
// 이 단어가 제목에 있으면 그 명소 영상이 거의 확실한 고유 지명
const UNIQUE = new Set("trevi colosseum eiffel louvre matterhorn jungfraujoch lauterbrunnen chillon stonehenge alhambra sagrada acropolis meteora mykonos cappadocia pamukkale bosphorus uluru banff borobudur komodo tegallalang uluwatu zhangjiajie jiufen taroko shilin merlion sentosa kinkaku dotonbori fushimi ayutthaya karnak kawasan boracay niagara versailles cesky guell amalfi giza buckingham hagia santorini shibuya dotonbori".split(' '));
const termWords = s => fold(s.en).split(/[\s,-]+/).filter(w => w.length >= 3 && !['the','and'].includes(w));
// 영상 제목이 명소와 관련 있는지 판단: 고유 지명 1개, 또는 검색어 단어 2개 이상 일치
function relevant(s, title){
  const t = fold(title);
  if (s.k) return t.includes(s.k);
  const ws = termWords(s);
  if (ws.some(w => UNIQUE.has(w) && t.includes(w))) return true;
  return ws.filter(w => t.includes(w)).length >= Math.min(2, ws.length);
}
const retryTerm = s => s.k || termWords(s).find(w => UNIQUE.has(w)) || termWords(s).slice(0,2).join(' ');
async function fetchVideos(term, limit=6){
  const key = term+'|'+limit;
  if (cache.has(key)) return cache.get(key);
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*'
    + '&generator=search&gsrnamespace=6&gsrlimit='+limit+'&gsrsearch='+enc('filetype:video '+term)
    + '&prop=videoinfo&viprop=url|mime|size|derivatives&viurlwidth=640';
  const p = fetch(url).then(r=>r.json()).then(j => {
    const pages = Object.values(j.query?.pages || {}).sort((a,b)=>(a.index||0)-(b.index||0));
    return pages.map(pg => {
      const v = pg.videoinfo?.[0]; if (!v) return null;
      const ders = (v.derivatives||[]).filter(x => /webm|mp4/.test(x.type));
      const pick = h => ders.find(x => x.transcodekey && x.transcodekey.startsWith(h));
      const small = pick('480p') || pick('360p') || pick('720p') || pick('240p');
      const big = pick('1080p') || pick('720p') || small;
      if (!small && v.size > 40e6) return null;           // 트랜스코드 없고 큰 원본은 제외
      return { title: pg.title.replace(/^File:/,'').replace(/\.\w+$/,'').replace(/_/g,' '),
               src: (small||v).src || v.url, hd: (big||v).src || v.url,
               poster: v.thumburl, page: v.descriptionurl };
    }).filter(Boolean)
      // 제목에 검색어 단어가 많이 들어간 영상을 우선 (검색 결과가 느슨하게 매칭되는 문제 보정)
      .map((v,i) => ({v, i, s: words(term).filter(w => fold(v.title).includes(w)).length}))
      .sort((a,b) => b.s-a.s || a.i-b.i).map(x => x.v);
  }).catch(() => []);
  cache.set(key, p);
  return p;
}
async function wikiImage(term){
  try{
    const r = await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch='+enc(term)+'&prop=pageimages&piprop=thumbnail&pithumbsize=700');
    const j = await r.json(); const pg = Object.values(j.query?.pages||{})[0];
    return pg?.thumbnail?.source || null;
  }catch{ return null; }
}

async function renderSpots(c){
  const grid = $('#grid');
  let spots = c.spots;
  if (!spots){ // 데이터에 없는 여행지: Commons에서 직접 검색
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">영상을 찾는 중…</div>';
    const vids = await fetchVideos(c.ko, 12);
    if (!vids.length){ grid.innerHTML = `<div class="empty" style="grid-column:1/-1">'${esc(c.ko)}' 영상을 찾지 못했어요. 영문 지명(예: Bali, Prague)으로 검색하거나 <a class="yt" href="${ytLink(c.ko)}" target="_blank" rel="noopener">YouTube 쇼츠에서 보기</a></div>`; return; }
    spots = vids.map(v => ({ko:v.title, en:null, d:'', preset:[v]}));
  }
  grid.innerHTML = spots.map((s,i) => `
    <article class="vcard" data-i="${i}">
      <div class="skeleton"></div>
      <span class="badge">불러오는 중</span>
      <button class="next" title="다른 영상" aria-label="다른 영상">⟳</button>
      <div class="meta"><h4>${esc(s.ko)}</h4>${s.d?`<p>${esc(s.d)}</p>`:''}
        <a class="yt" href="${ytLink(s.en||s.ko)}" target="_blank" rel="noopener">▶ 쇼츠 더보기</a></div>
    </article>`).join('');
  const cards = [...grid.children];
  cards.forEach((el,i) => { el._spot = spots[i]; el._idx = 0; });
  cards.forEach(el => {
    el.querySelector('.yt').addEventListener('click', e => e.stopPropagation());
    el.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); cycle(el); });
    el.addEventListener('click', () => openModal(el));
    el.addEventListener('mouseenter', () => el._v && el._v.play().catch(()=>{}));
  });
  // 화면 근처에 오면 미리 로딩 (작은 화면에서도 카드가 조금만 보여도 시작)
  const loader = new IntersectionObserver(ents => ents.forEach(en => {
    if (en.isIntersecting && !en.target._loaded){ loadCard(en.target); loader.unobserve(en.target); }
  }), {rootMargin:'300px 0px'});
  // 보이는 카드만 재생, 벗어나면 정지
  const player = new IntersectionObserver(ents => ents.forEach(en => {
    const v = en.target._v; if (!v) return;
    en.isIntersecting ? v.play().catch(()=>{}) : v.pause();
  }), {threshold:.2});
  cards.forEach(el => { loader.observe(el); player.observe(el); });
}

async function loadCard(el){
  el._loaded = true;
  const s = el._spot;
  if (s.preset) el._vids = s.preset;
  else {
    // 제목에 명소의 핵심 단어가 없는 영상(엉뚱한 검색 결과)은 제외
    const ok = v => relevant(s, v.title);
    el._vids = (await fetchVideos(s.en, 8)).filter(ok);
    if (!el._vids.length) el._vids = (await fetchVideos(retryTerm(s), 8)).filter(ok); // 핵심 단어로 재검색
  }
  if (!el.isConnected) return;
  const badge = el.querySelector('.badge');
  if (!el._vids.length){
    const img = await wikiImage(s.en || s.ko);
    el.querySelector('.skeleton')?.remove();
    if (img) el.insertAdjacentHTML('afterbegin', `<img class="poster" src="${img}" alt="">`);
    badge.textContent = '사진 · 쇼츠는 YouTube에서'; el.querySelector('.next').remove();
    el._noVideo = true; return;
  }
  if (el._vids.length < 2) el.querySelector('.next').remove();
  setVideo(el, 0);
}

function setVideo(el, idx){
  const v = el._vids[idx]; el._idx = idx;
  el._v?.remove();
  const vid = document.createElement('video');
  Object.assign(vid, { muted:true, loop:true, playsInline:true, preload:'metadata', poster:v.poster||'', src:v.src });
  vid.setAttribute('muted',''); vid.setAttribute('playsinline','');
  el.prepend(vid); el._v = vid;
  const badge = el.querySelector('.badge');
  badge.textContent = `영상 ${idx+1}/${el._vids.length}`;
  vid.addEventListener('playing', () => { badge.classList.add('live'); el.querySelector('.skeleton')?.remove(); }, {once:true});
  vid.addEventListener('loadeddata', () => el.querySelector('.skeleton')?.remove(), {once:true});
  vid.addEventListener('error', () => { if (idx+1 < el._vids.length) setVideo(el, idx+1); });
  vid.play().catch(()=>{});
}
const cycle = el => el._vids && setVideo(el, (el._idx+1) % el._vids.length);

function openModal(el){
  const s = el._spot;
  if (el._noVideo || !el._vids){ window.open(ytLink(s.en||s.ko), '_blank', 'noopener'); return; }
  const v = el._vids[el._idx];
  const m = $('#mVid'); m.poster = v.poster||''; m.src = v.hd; m.muted = false; m.play().catch(()=>{});
  $('#mTitle').textContent = s.ko;
  $('#mCredit').textContent = v.title + ' · Wikimedia Commons';
  $('#mSrc').href = v.page; $('#mYt').href = ytLink(s.en||s.ko);
  $('#modal').classList.add('open');
}
function closeModal(){ $('#modal').classList.remove('open'); const m=$('#mVid'); m.pause(); m.removeAttribute('src'); m.load(); }
$('#mClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
addEventListener('keydown', e => e.key==='Escape' && closeModal());

  const sky = to ? `https://www.skyscanner.co.kr/transport/flights/${from.toLowerCase()}/${to.toLowerCase()}/${yymmdd(d1)}/${yymmdd(d2)}/?adultsv2=${pax}&cabinclass=economy`

  const nv = to ? `https://flight.naver.com/flights/international/${from}-${to}-${ymd(d1)}/${to}-${from}-${ymd(d2)}?adult=${pax}&fareType=Y`

    <div class="two">
      <div class="panel">
        ${c.aps && c.aps.length > 1 ? `<h4>도착 공항 선택</h4>
        <div class="ap-pick">${c.aps.map(a => `<button type="button" data-ap="${a.code}" class="${a.code===to?'on':''}">${esc(a.name)} <small>${a.code}</small></button>`).join('')}</div>` : ''}
        <h4>노선 정보</h4>
        <div class="route">
          <div class="ap">${from}<small>${esc(fromName)}</small></div>
          <div class="line">${c.flight?`<span class="dur">${esc(c.flight)}</span>`:''}</div>
          <div class="ap">${to||'✈'}<small>${esc(c.city)}</small></div>
        </div>
        ${c.custom ? `<p class="note">이 여행지는 상세 노선 정보가 없어요. 오른쪽 사이트에서 공항을 선택해 검색해 주세요.</p>` : `
        <dl class="kv">
          <dt>도착 공항</dt><dd>${esc(ap.name)} (${to})</dd>
          <dt>비행 시간</dt><dd>${esc(c.flight)}${from!=='ICN'?' <small style="color:var(--muted);font-weight:400">(인천 기준)</small>':''}</dd>
          <dt>주요 항공사</dt><dd>${esc(c.airlines)}</dd>
          <dt>입국</dt><dd>${esc(c.visa)}</dd>
        </dl>`}
        <p class="note">※ 비행시간은 직항 기준 대략치이며, 비자·입국 정책은 출발 전 외교부 해외안전여행에서 꼭 확인하세요.</p>
      </div>
      <div class="links">
        <a class="lnk" href="${gf}" target="_blank" rel="noopener"><div><b>Google 항공편</b><span>가격 추이·최저가 날짜 그래프</span></div><span class="arr">검색 →</span></a>
        <a class="lnk" href="${sky}" target="_blank" rel="noopener"><div><b>스카이스캐너</b><span>항공사·여행사 가격 한 번에 비교</span></div><span class="arr">검색 →</span></a>
        <a class="lnk" href="${nv}" target="_blank" rel="noopener"><div><b>네이버 항공권</b><span>국내 여행사 특가·원화 결제</span></div><span class="arr">검색 →</span></a>
      </div>
    </div>`;

  const bk = area => `https://www.booking.com/searchresults.ko.html?ss=${enc(area)}&checkin=${d1}&checkout=${d2}&group_adults=${pax}&no_rooms=1&lang=ko`;
  const ag = area => `https://www.agoda.com/ko-kr/search?textToSearch=${enc(area)}&checkIn=${d1}&los=${nights}&adults=${pax}&rooms=1`;
  const gh = area => `https://www.google.com/travel/search?hl=ko&curr=KRW&q=${enc(area+' hotels')}`;
  $('#hotels').innerHTML = `
    <div class="block-title"><h3>🏨 호텔</h3><small>${esc(c.city)} · ${nights}박 · 성인 ${pax}명</small></div>
    <div class="links" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:16px">
      <a class="lnk" href="${bk(c.cityEn)}" target="_blank" rel="noopener"><div><b>부킹닷컴</b><span>무료 취소 옵션 많음</span></div><span class="arr">→</span></a>
      <a class="lnk" href="${ag(c.cityEn)}" target="_blank" rel="noopener"><div><b>아고다</b><span>아시아 숙소 특가</span></div><span class="arr">→</span></a>

        <div class="area"><b>${esc(a.n)}</b><p>${esc(a.d)}</p>
          <div class="mini"><a href="${bk(a.q||a.n+' '+base.cityEn)}" target="_blank" rel="noopener">부킹닷컴</a><a href="${ag(a.q||a.n+' '+base.cityEn)}" target="_blank" rel="noopener">아고다</a><a href="${gh(a.q||a.n+' '+base.city)}" target="_blank" rel="noopener">Google 호텔</a></div></div>`).join('')}
      </div>
    </div>`;
}

document.addEventListener('click', e => {

/* ---------- 환율 (open.er-api.com, 매일 갱신) ---------- */
let fxData = null;
async function showFx(c){
  const cur = (c.currency.match(/\(([A-Z]{3})\)/) || [])[1];
  const el = () => document.getElementById('fx');
  if (!cur) { el()?.remove(); return; }
  try {
    fxData = fxData || fetch('https://open.er-api.com/v6/latest/KRW').then(r => r.json());
    const j = await fxData; const rate = j.rates?.[cur];
    if (!rate || current !== c || !el()) { if (!rate) el()?.remove(); return; }
    const won = 1 / rate, unit = won < 1 ? 1000 : won < 10 ? 100 : 1;   // 엔·동처럼 단위가 작으면 100·1000 단위로
    const date = new Date(j.time_last_update_unix * 1000);
    el().innerHTML = `<b>환율 · ${date.getMonth()+1}/${date.getDate()} 기준</b>${unit.toLocaleString()} ${cur} = ${(won*unit).toLocaleString('ko-KR',{maximumFractionDigits: won*unit < 100 ? 2 : 0})}원`;
  } catch { el()?.remove(); }
}

/* ---------- 연관 검색어 ---------- */
const hasKo = s => /[가-힣]/.test(s);
const SUG = [];
DESTS.forEach(d => {
  SUG.push({t:0, label:d.ko, sub:d.tagline, d, keys:[d.ko, d.city, ...d.aliases]});
  const seen = new Set([d.ko]);
  const addCity = (label, keys) => { if (seen.has(label)) return; seen.add(label);
    SUG.push({t:1, label, sub:d.ko, d, word:label, keys}); };
  d.aliases.filter(hasKo).forEach(a => addCity(a, [a]));
  d.aps.forEach(a => addCity(a.name.split(' ')[0], [a.name, a.en, a.code]));
  d.spots.forEach(s => SUG.push({t:2, label:s.ko, sub:`${d.ko} · ${s.d}`, d, keys:[s.ko, s.en]}));
});
const KIND = ['국가','도시','명소'];
const POPULAR = ["일본","베트남","태국","대만","홍콩","프랑스","스위스","미국"];
let sugItems = [], sugIdx = -1;

function suggest(){
  const q = $('#q').value.trim(), n = norm(q);
  if (!n) sugItems = POPULAR.map(k => SUG.find(s => s.t===0 && s.label===k));
  else sugItems = SUG.map(s => {
      const l = norm(s.label);
      const score = l.startsWith(n) ? 0 : l.includes(n) ? 1 : s.keys.some(k => norm(k).includes(n)) ? 2 : -1;
      return {s, score};
    }).filter(x => x.score >= 0).sort((a,b) => a.score-b.score || a.s.t-b.s.t).slice(0,8).map(x => x.s);
  sugIdx = n && sugItems.length ? 0 : -1;
  const hl = label => { const i = norm(label).indexOf(n);  // 입력한 부분 강조
    return n && i >= 0 && !/\s/.test(label) ? esc(label.slice(0,i))+'<mark>'+esc(label.slice(i,i+n.length))+'</mark>'+esc(label.slice(i+n.length)) : esc(label); };
  const box = $('#suggest');
  box.innerHTML = (n ? '' : '<li class="head">인기 여행지</li>') + (sugItems.length ? sugItems.map((s,i) => `
    <li class="opt${i===sugIdx?' on':''}" role="option" data-i="${i}">
      <span class="ic">${s.t===0 ? s.d.flagImg : s.t===1 ? '📍' : '📸'}</span>
      <span><b>${hl(s.label)}</b><small>${esc(s.sub)}</small></span>
      <span class="kind">${KIND[s.t]}</span></li>`).join('')
    : `<li class="head">'${esc(q)}' 검색 결과가 없어요 · Enter를 누르면 영상을 직접 찾아볼게요</li>`);
  box.hidden = false; $('#q').setAttribute('aria-expanded','true');
}
function hideSuggest(){ $('#suggest').hidden = true; $('#q').setAttribute('aria-expanded','false'); }
function pick(s){ $('#q').value = s.label; hideSuggest(); render(s.d.ko, s.word); }
$('#q').addEventListener('input', suggest);
$('#q').addEventListener('focus', suggest);
$('#q').addEventListener('blur', () => setTimeout(hideSuggest, 120));
$('#q').addEventListener('keydown', e => {
  if ($('#suggest').hidden || !sugItems.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + sugItems.length) % sugItems.length;
    document.querySelectorAll('#suggest .opt').forEach((li,i) => li.classList.toggle('on', i === sugIdx));
  } else if (e.key === 'Escape') hideSuggest();
});
$('#suggest').addEventListener('mousedown', e => {
  const li = e.target.closest('.opt'); if (li){ e.preventDefault(); pick(sugItems[+li.dataset.i]); }
});
$('#suggest').addEventListener('mousemove', e => {
  const li = e.target.closest('.opt'); if (!li || +li.dataset.i === sugIdx) return;
  sugIdx = +li.dataset.i; document.querySelectorAll('#suggest .opt').forEach((x,i) => x.classList.toggle('on', i === sugIdx));
});

$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#q').value.trim(); if (!q) return;
  if (!$('#suggest').hidden && sugIdx >= 0 && sugItems[sugIdx]) return pick(sugItems[sugIdx]);
  hideSuggest(); render(q);
});
document.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b){ $('#q').value = b.dataset.q; render(b.dataset.q); } });
$('.logo').addEventListener('click', () => { history.replaceState(null,'',location.pathname); $('#q').value=''; current = null; renderHome(); scrollTo({top:0,behavior:'smooth'}); });
if (location.hash.length > 1){ const q = decodeURIComponent(location.hash.slice(1)); if (!['spots','flights','hotels'].includes(q)){ $('#q').value = q; render(q); } }
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트립릴스 · 여행지 영상 미리보기</title>
<meta name="description" content="가고 싶은 여행지를 입력하면 주요 명소를 짧은 영상으로 보여주고, 항공편·호텔 검색까지 한 번에.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0b0f17; --bg2:#121826; --card:#161d2d; --line:#263049;
    --text:#eef2fa; --muted:#98a3ba; --accent:#ff6b4a; --accent2:#ffb347; --ok:#4ade80;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}

  /* ---------- Hero ---------- */
  .hero{position:relative;min-height:440px;display:flex;align-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .hero-bg{position:absolute;inset:0;background:radial-gradient(1200px 500px at 15% 0%,#ff6b4a33,transparent 60%),radial-gradient(900px 500px at 90% 100%,#3b82f633,transparent 60%),var(--bg)}
  .hero-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
  .hero-bg video.on{opacity:.35}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b0f1700 30%,var(--bg) 100%)}
  .hero .wrap{position:relative;z-index:1;width:100%;padding-top:56px;padding-bottom:48px}
  .logo{font-weight:800;letter-spacing:-.02em;font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:36px}
  .logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-style:normal;font-size:15px}
  h1{font-size:clamp(30px,5vw,52px);line-height:1.15;letter-spacing:-.03em;font-weight:800}
  h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin-top:12px;font-size:17px}

  .search{margin-top:28px;background:#ffffff0d;border:1px solid #ffffff1f;backdrop-filter:blur(12px);border-radius:22px;padding:10px;display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr .8fr auto;gap:8px}
  .field{background:#0b0f17b3;border:1px solid var(--line);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;min-width:0}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600}
  .field input,.field select{background:none;border:0;outline:0;font-size:15.5px;font-weight:600;padding:2px 0;width:100%;color-scheme:dark}
  .field select option{background:var(--bg2)}
  .field:focus-within{border-color:var(--accent)}
  .go{background:linear-gradient(135deg,var(--accent),#ff8f4a);border:0;border-radius:14px;padding:0 26px;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap;transition:transform .15s,filter .15s}
  .go:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{background:#ffffff0f;border:1px solid #ffffff1a;border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;transition:background .15s}
  .chip:hover{background:#ffffff21}

  /* ---------- Sections ---------- */
  main{padding:40px 0 80px}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .empty b{display:block;font-size:44px;margin-bottom:8px}
  .dest-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .dest-head h2{font-size:34px;letter-spacing:-.02em;font-weight:800}
  .dest-head h2 span{font-size:38px;margin-right:6px}
  .dest-head p{color:var(--muted);margin-top:4px}
  .facts{display:flex;gap:8px;flex-wrap:wrap}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
  .fact b{display:block;font-size:11px;color:var(--muted);font-weight:600}
  .tabs{display:flex;gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);border:1px solid transparent}
  .tab:hover{color:var(--text);border-color:var(--line)}
  section.block{scroll-margin-top:70px;margin-top:36px}
  .block-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
  .block-title h3{font-size:22px;letter-spacing:-.01em}
  .block-title small{color:var(--muted);font-size:13px}

  /* ---------- Video grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .vcard{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--line);aspect-ratio:9/13;cursor:pointer;isolation:isolate;transition:transform .2s,border-color .2s}
  .vcard:hover{transform:translateY(-3px);border-color:#3b4767}
  .vcard video,.vcard img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  .vcard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0000 45%,#000000d9 100%)}
  .vcard .skeleton{position:absolute;inset:0;z-index:-3;background:linear-gradient(100deg,#161d2d 30%,#1f2840 50%,#161d2d 70%);background-size:300% 100%;animation:sh 1.4s infinite}
  @keyframes sh{to{background-position:-150% 0}}
  .vcard .meta{position:absolute;left:0;right:0;bottom:0;padding:16px}
  .vcard .meta h4{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .vcard .meta p{font-size:13px;color:#d3d9e6;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{position:absolute;top:12px;left:12px;background:#000000a0;backdrop-filter:blur(6px);border-radius:999px;font-size:11.5px;padding:4px 9px;font-weight:600}
  .badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .next{position:absolute;top:10px;right:10px;background:#000000a0;border:0;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:14px;opacity:0;transition:opacity .2s}
  .vcard:hover .next{opacity:1}
  .yt{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:600;background:#ff000026;border:1px solid #ff00004d;border-radius:8px;padding:4px 9px}
  .yt:hover{background:#ff000040}

  /* ---------- Info cards ---------- */
  .two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .panel h4{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:12px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:15px}
  .kv dt{color:var(--muted)}
  .kv dd{font-weight:600}
  .route{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .route .ap{font-size:30px;font-weight:800;letter-spacing:.02em}
  .route .ap small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
  .route .line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px);position:relative}
  .route .line::after{content:"✈";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:var(--card);padding:0 6px;color:var(--accent2)}
  .route .dur{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
  .links{display:grid;gap:10px}
  .lnk{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .15s,background .15s}
  .lnk:hover{border-color:var(--accent);background:#1a2133}
  .lnk b{font-size:15.5px}
  .lnk span{font-size:12.5px;color:var(--muted);display:block}
  .lnk .arr{color:var(--accent);font-weight:700}
  .areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .area{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .area b{font-size:16px}
  .area p{font-size:13px;color:var(--muted);margin-top:3px}
  .area .mini{display:flex;gap:6px;margin-top:10px}
  .area .mini a{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .area .mini a:hover{border-color:var(--accent)}
  .note{font-size:12.5px;color:var(--muted);margin-top:14px}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;background:#000000e0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modal-box{width:min(960px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .modal video{display:block;width:100%;max-height:70vh;background:#000}
  .modal-info{padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .modal-info h4{font-size:19px}
  .modal-info p{font-size:13px;color:var(--muted)}
  .modal-info .acts{display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .x{position:absolute;top:16px;right:20px;font-size:30px;background:none;border:0;cursor:pointer;color:#fff}

  footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:24px 0;text-align:center}

  @media (max-width:900px){
    .search{grid-template-columns:1fr 1fr}
    .search .field.dest{grid-column:1/-1}
    .go{grid-column:1/-1;padding:14px}
    .two{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .wrap{padding:0 16px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .vcard .meta{padding:10px}.vcard .meta h4{font-size:15px}.vcard .meta p{display:none}
    .dest-head h2{font-size:27px}
    .kv{grid-template-columns:90px 1fr}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-bg"><video id="heroVid" muted loop playsinline></video></div>
  <div class="wrap">
    <div class="logo"><i>▶</i>트립릴스</div>
    <h1>어디로 떠나고 싶으세요?<br><em>명소를 영상으로 먼저 여행하세요</em></h1>
    <p class="sub">여행지를 입력하면 주요 관광지를 짧은 영상으로 보여드리고, 항공편·호텔 검색까지 바로 연결해 드려요.</p>

    <form class="search" id="searchForm" autocomplete="off">
      <div class="field dest">
        <label for="q">여행지 (국가 또는 도시)</label>
        <input id="q" list="destList" placeholder="예: 일본, 파리, 다낭, 스위스…" required>
        <datalist id="destList"></datalist>
      </div>
      <div class="field">
        <label for="from">출발</label>
        <select id="from">
          <option value="ICN">인천 (ICN)</option>
          <option value="GMP">김포 (GMP)</option>
          <option value="PUS">부산 김해 (PUS)</option>
          <option value="CJU">제주 (CJU)</option>
          <option value="TAE">대구 (TAE)</option>
        </select>
      </div>
      <div class="field"><label for="d1">가는 날</label><input type="date" id="d1"></div>
      <div class="field"><label for="d2">오는 날</label><input type="date" id="d2"></div>
      <div class="field">
        <label for="pax">인원</label>
        <select id="pax"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
      </div>
      <button class="go" type="submit">영상 보기 ▶</button>
    </form>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="empty"><b>🌏</b>위에서 여행지를 입력하거나 인기 여행지를 눌러 보세요.</div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="x" id="mClose" aria-label="닫기">×</button>
  <div class="modal-box">
    <video id="mVid" controls playsinline></video>
    <div class="modal-info">
      <div><h4 id="mTitle"></h4><p id="mCredit"></p></div>
      <div class="acts"><a class="btn" id="mYt" target="_blank" rel="noopener">YouTube 쇼츠 더보기</a><a class="btn" id="mSrc" target="_blank" rel="noopener">원본 영상</a></div>
    </div>
  </div>
</div>

<footer>영상: Wikimedia Commons (각 영상의 라이선스는 원본 페이지에서 확인) · 항공·호텔 가격은 연결된 예약 사이트에서 실시간으로 확인하세요.</footer>

/* =========================================================
   Wikimedia Commons 영상 검색
   ========================================================= */
const cache = new Map();
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const words = t => fold(t).split(/[\s-]+/).filter(w => w.length > 3);
// 이 단어가 제목에 있으면 그 명소 영상이 거의 확실한 고유 지명
const UNIQUE = new Set("trevi colosseum eiffel louvre matterhorn jungfraujoch lauterbrunnen chillon stonehenge alhambra sagrada acropolis meteora mykonos cappadocia pamukkale bosphorus uluru banff borobudur komodo tegallalang uluwatu zhangjiajie jiufen taroko shilin merlion sentosa kinkaku dotonbori fushimi ayutthaya karnak kawasan boracay niagara versailles cesky guell amalfi giza buckingham hagia santorini shibuya dotonbori".split(' '));
const termWords = s => fold(s.en).split(/[\s,-]+/).filter(w => w.length >= 3 && !['the','and'].includes(w));
// 영상 제목이 명소와 관련 있는지 판단: 고유 지명 1개, 또는 검색어 단어 2개 이상 일치
function relevant(s, title){
  const t = fold(title);
  if (s.k) return t.includes(s.k);
  const ws = termWords(s);
  if (ws.some(w => UNIQUE.has(w) && t.includes(w))) return true;
  return ws.filter(w => t.includes(w)).length >= Math.min(2, ws.length);
}
const retryTerm = s => s.k || termWords(s).find(w => UNIQUE.has(w)) || termWords(s).slice(0,2).join(' ');
async function fetchVideos(term, limit=6){
  const key = term+'|'+limit;
  if (cache.has(key)) return cache.get(key);
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*'
    + '&generator=search&gsrnamespace=6&gsrlimit='+limit+'&gsrsearch='+enc('filetype:video '+term)
    + '&prop=videoinfo&viprop=url|mime|size|derivatives&viurlwidth=640';
  const p = fetch(url).then(r=>r.json()).then(j => {
    const pages = Object.values(j.query?.pages || {}).sort((a,b)=>(a.index||0)-(b.index||0));
    return pages.map(pg => {
      const v = pg.videoinfo?.[0]; if (!v) return null;
      const ders = (v.derivatives||[]).filter(x => /webm|mp4/.test(x.type));
      const pick = h => ders.find(x => x.transcodekey && x.transcodekey.startsWith(h));
      const small = pick('480p') || pick('360p') || pick('720p') || pick('240p');
      const big = pick('1080p') || pick('720p') || small;
      if (!small && v.size > 40e6) return null;           // 트랜스코드 없고 큰 원본은 제외
      return { title: pg.title.replace(/^File:/,'').replace(/\.\w+$/,'').replace(/_/g,' '),
               src: (small||v).src || v.url, hd: (big||v).src || v.url,
               poster: v.thumburl, page: v.descriptionurl };
    }).filter(Boolean)
      // 제목에 검색어 단어가 많이 들어간 영상을 우선 (검색 결과가 느슨하게 매칭되는 문제 보정)
      .map((v,i) => ({v, i, s: words(term).filter(w => fold(v.title).includes(w)).length}))
      .sort((a,b) => b.s-a.s || a.i-b.i).map(x => x.v);
  }).catch(() => []);
  cache.set(key, p);
  return p;
}
async function wikiImage(term){
  try{
    const r = await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch='+enc(term)+'&prop=pageimages&piprop=thumbnail&pithumbsize=700');
    const j = await r.json(); const pg = Object.values(j.query?.pages||{})[0];
    return pg?.thumbnail?.source || null;
  }catch{ return null; }
}

async function renderSpots(c){
  const grid = $('#grid');
  let spots = c.spots;
  if (!spots){ // 데이터에 없는 여행지: Commons에서 직접 검색
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">영상을 찾는 중…</div>';
    const vids = await fetchVideos(c.ko, 12);
    if (!vids.length){ grid.innerHTML = `<div class="empty" style="grid-column:1/-1">'${esc(c.ko)}' 영상을 찾지 못했어요. 영문 지명(예: Bali, Prague)으로 검색하거나 <a class="yt" href="${ytLink(c.ko)}" target="_blank" rel="noopener">YouTube 쇼츠에서 보기</a></div>`; return; }
    spots = vids.map(v => ({ko:v.title, en:null, d:'', preset:[v]}));
  }
  grid.innerHTML = spots.map((s,i) => `
    <article class="vcard" data-i="${i}">
      <div class="skeleton"></div>
      <span class="badge">불러오는 중</span>
      <button class="next" title="다른 영상" aria-label="다른 영상">⟳</button>
      <div class="meta"><h4>${esc(s.ko)}</h4>${s.d?`<p>${esc(s.d)}</p>`:''}
        <a class="yt" href="${ytLink(s.en||s.ko)}" target="_blank" rel="noopener">▶ 쇼츠 더보기</a></div>
    </article>`).join('');
  const cards = [...grid.children];
  cards.forEach((el,i) => { el._spot = spots[i]; el._idx = 0; });
  cards.forEach(el => {
    el.querySelector('.yt').addEventListener('click', e => e.stopPropagation());
    el.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); cycle(el); });
    el.addEventListener('click', () => openModal(el));
    el.addEventListener('mouseenter', () => el._v && el._v.play().catch(()=>{}));
  });
  // 화면에 보일 때 로딩 + 재생, 벗어나면 정지
  const io = new IntersectionObserver(ents => ents.forEach(en => {
    const el = en.target;
    if (en.isIntersecting){ if (!el._loaded) loadCard(el); else el._v && el._v.play().catch(()=>{}); }
    else el._v && el._v.pause();
  }), {threshold:.35});
  cards.forEach(el => io.observe(el));
}

async function loadCard(el){
  el._loaded = true;
  const s = el._spot;
  if (s.preset) el._vids = s.preset;
  else {
    // 제목에 명소의 핵심 단어가 없는 영상(엉뚱한 검색 결과)은 제외
    const ok = v => relevant(s, v.title);
    el._vids = (await fetchVideos(s.en, 8)).filter(ok);
    if (!el._vids.length) el._vids = (await fetchVideos(retryTerm(s), 8)).filter(ok); // 핵심 단어로 재검색
  }
  if (!el.isConnected) return;
  const badge = el.querySelector('.badge');
  if (!el._vids.length){
    const img = await wikiImage(s.en || s.ko);
    el.querySelector('.skeleton')?.remove();
    if (img) el.insertAdjacentHTML('afterbegin', `<img class="poster" src="${img}" alt="">`);
    badge.textContent = '사진 · 쇼츠는 YouTube에서'; el.querySelector('.next').remove();
    el._noVideo = true; return;
  }
  if (el._vids.length < 2) el.querySelector('.next').remove();
  setVideo(el, 0);
  // 첫 카드 영상을 히어로 배경으로
  if (el.dataset.i === '0'){ const hv = $('#heroVid'); hv.src = el._vids[0].src; hv.oncanplay = () => { hv.classList.add('on'); hv.play().catch(()=>{}); }; }
}

function setVideo(el, idx){
  const v = el._vids[idx]; el._idx = idx;
  el._v?.remove();
  const vid = document.createElement('video');
  Object.assign(vid, { muted:true, loop:true, playsInline:true, preload:'metadata', poster:v.poster||'', src:v.src });
  vid.setAttribute('muted',''); vid.setAttribute('playsinline','');
  el.prepend(vid); el._v = vid;
  const badge = el.querySelector('.badge');
  badge.textContent = `영상 ${idx+1}/${el._vids.length}`;
  vid.addEventListener('playing', () => { badge.classList.add('live'); el.querySelector('.skeleton')?.remove(); }, {once:true});
  vid.addEventListener('loadeddata', () => el.querySelector('.skeleton')?.remove(), {once:true});
  vid.addEventListener('error', () => { if (idx+1 < el._vids.length) setVideo(el, idx+1); });
  vid.play().catch(()=>{});
}
const cycle = el => el._vids && setVideo(el, (el._idx+1) % el._vids.length);

function openModal(el){
  const s = el._spot;
  if (el._noVideo || !el._vids){ window.open(ytLink(s.en||s.ko), '_blank', 'noopener'); return; }
  const v = el._vids[el._idx];
  const m = $('#mVid'); m.poster = v.poster||''; m.src = v.hd; m.muted = false; m.play().catch(()=>{});
  $('#mTitle').textContent = s.ko;
  $('#mCredit').textContent = v.title + ' · Wikimedia Commons';
  $('#mSrc').href = v.page; $('#mYt').href = ytLink(s.en||s.ko);
  $('#modal').classList.add('open');
}
function closeModal(){ $('#modal').classList.remove('open'); const m=$('#mVid'); m.pause(); m.removeAttribute('src'); m.load(); }
$('#mClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
addEventListener('keydown', e => e.key==='Escape' && closeModal());

/* ---------- 항공·호텔 ---------- */
function renderTravel(c){
  const from = $('#from').value, fromName = $('#from').selectedOptions[0].text.split(' (')[0];
  const d1 = $('#d1').value, d2 = $('#d2').value, pax = $('#pax').value;
  const to = c.iata;
  const nights = Math.max(1, Math.round((new Date(d2)-new Date(d1))/864e5));

  const gf = 'https://www.google.com/travel/flights?hl=ko&curr=KRW&q=' + enc(`Flights to ${to||c.cityEn} from ${from} on ${d1} through ${d2} ${pax} adults`);
  const sky = to ? `https://www.skyscanner.co.kr/transport/flights/${from.toLowerCase()}/${to.toLowerCase()}/${yymmdd(d1)}/${yymmdd(d2)}/?adultsv2=${pax}&cabinclass=economy`
                 : `https://www.skyscanner.co.kr/`;
  const nv = to ? `https://flight.naver.com/flights/international/${from}-${to}-${ymd(d1)}/${to}-${from}-${ymd(d2)}?adult=${pax}&fareType=Y`
                : `https://flight.naver.com/`;

  $('#flights').innerHTML = `
    <div class="block-title"><h3>✈️ 항공편</h3><small>${esc(fromName)} → ${esc(c.city)} · ${d1} ~ ${d2} · 성인 ${pax}명</small></div>
    <div class="two">
      <div class="panel">
        <h4>노선 정보</h4>
        <div class="route">
          <div class="ap">${from}<small>${esc(fromName)}</small></div>
          <div class="line">${c.flight?`<span class="dur">${esc(c.flight)}</span>`:''}</div>
          <div class="ap">${to||'✈'}<small>${esc(c.city)}</small></div>
        </div>
        ${c.custom ? `<p class="note">이 여행지는 상세 노선 정보가 없어요. 오른쪽 사이트에서 공항을 선택해 검색해 주세요.</p>` : `
        <dl class="kv">
          <dt>도착 공항</dt><dd>${esc(c.airport)} (${to})</dd>
          <dt>비행 시간</dt><dd>${esc(c.flight)}${from!=='ICN'?' <small style="color:var(--muted);font-weight:400">(인천 기준)</small>':''}</dd>
          <dt>주요 항공사</dt><dd>${esc(c.airlines)}</dd>
          <dt>입국</dt><dd>${esc(c.visa)}</dd>
        </dl>`}
        <p class="note">※ 비행시간은 직항 기준 대략치이며, 비자·입국 정책은 출발 전 외교부 해외안전여행에서 꼭 확인하세요.</p>
      </div>
      <div class="links">
        <a class="lnk" href="${gf}" target="_blank" rel="noopener"><div><b>Google 항공편</b><span>가격 추이·최저가 날짜 그래프</span></div><span class="arr">검색 →</span></a>
        <a class="lnk" href="${sky}" target="_blank" rel="noopener"><div><b>스카이스캐너</b><span>항공사·여행사 가격 한 번에 비교</span></div><span class="arr">검색 →</span></a>
        <a class="lnk" href="${nv}" target="_blank" rel="noopener"><div><b>네이버 항공권</b><span>국내 여행사 특가·원화 결제</span></div><span class="arr">검색 →</span></a>
      </div>
    </div>`;

  const bk = area => `https://www.booking.com/searchresults.ko.html?ss=${enc(area)}&checkin=${d1}&checkout=${d2}&group_adults=${pax}&no_rooms=1&lang=ko`;
  const ag = area => `https://www.agoda.com/ko-kr/search?textToSearch=${enc(area)}&checkIn=${d1}&los=${nights}&adults=${pax}&rooms=1`;
  const gh = area => `https://www.google.com/travel/search?hl=ko&curr=KRW&q=${enc(area+' hotels')}`;
  $('#hotels').innerHTML = `
    <div class="block-title"><h3>🏨 호텔</h3><small>${esc(c.city)} · ${nights}박 · 성인 ${pax}명</small></div>
    <div class="links" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:16px">
      <a class="lnk" href="${bk(c.cityEn)}" target="_blank" rel="noopener"><div><b>부킹닷컴</b><span>무료 취소 옵션 많음</span></div><span class="arr">→</span></a>
      <a class="lnk" href="${ag(c.cityEn)}" target="_blank" rel="noopener"><div><b>아고다</b><span>아시아 숙소 특가</span></div><span class="arr">→</span></a>
      <a class="lnk" href="${gh(c.cityEn)}" target="_blank" rel="noopener"><div><b>Google 호텔</b><span>지도로 위치·가격 비교</span></div><span class="arr">→</span></a>
    </div>
    <div class="panel">
      <h4>추천 숙소 지역</h4>
      <div class="areas">${c.areas.map(a => `
        <div class="area"><b>${esc(a.n)}</b><p>${esc(a.d)}</p>
          <div class="mini"><a href="${bk(a.n+' '+c.cityEn)}" target="_blank" rel="noopener">부킹닷컴</a><a href="${gh(a.n+' '+c.city)}" target="_blank" rel="noopener">Google 호텔</a></div></div>`).join('')}
      </div>
    </div>`;
}

/* ---------- 이벤트 ---------- */
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) render(q); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b){ $('#q').value = b.dataset.q; render(b.dataset.q); } });
if (location.hash.length > 1){ const q = decodeURIComponent(location.hash.slice(1)); if (!['spots','flights','hotels'].includes(q)){ $('#q').value = q; render(q); } }
</script>
</body>
